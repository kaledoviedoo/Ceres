[project]
name = "ceres-api"
version = "0.1.0"
description = "CERES — backend del Digital Twin agricola (MVP)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "postgres: requiere un PostgreSQL real (Supabase). Se salta automaticamente si TEST_DATABASE_URL no esta definida.",
]

[tool.ruff]
line-length = 100
target-version = "py311"
